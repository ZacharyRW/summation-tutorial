[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "canonical: tests for the maintained summation lesson",
    "historical: tests for preserved historical demonstration artifacts",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
exclude = ["history/**", "notebooks/**"]

[tool.ruff.lint.isort]
combine-as-imports = true
